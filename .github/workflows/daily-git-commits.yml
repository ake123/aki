name: Daily Git commits and portfolio deploy

on:
  # Four automated refreshes every day in Helsinki local time.
  schedule:
    - cron: "17 3,9,15,21 * * *"
      timezone: "Europe/Helsinki"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**.qmd"
      - "_quarto.yml"
      - "styles/**"
      - "js/**"
      - "includes/**"
      - "scripts/**"
      - "images/**"
      - "cv/**"
      - ".github/workflows/daily-git-commits.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Refresh live portfolio data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python3 scripts/update_site_pulse.py

      - name: Commit scheduled refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "akeketema@yahoo.com"
          git add data/site-pulse.json
          git commit -m "chore(portfolio): automated refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
